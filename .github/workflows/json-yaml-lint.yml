name: CI-yaml-json-lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yamllint

      - name: Validate JSON
        run: jq empty json-yaml/config.json

      - name: Validate YAML
        run: yamllint json-yaml/config.yml

  naoru:
    needs: [build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.GROQ_API_KEY }}
          provider: openrouter
          failed-job-name: build