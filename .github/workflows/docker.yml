name: CI-Docker

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t naoru-test .

  naoru:
    needs: [build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.GROQ_API_KEY }}
          provider: openrouter
          model: qwen/qwen3-coder
          failed-job-name: build
          fix-mode: suggest