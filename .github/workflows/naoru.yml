name: naoru-ci-doctor-multitool-test

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Create broken terraform config
        run: |
          mkdir -p terraform
          cat > terraform/main.tf <<'EOF'
          terraform {
            required_version = ">= 1.0"
          }

          resource "null_resource" "test" {
            invalid_attr = "boom"
          }
          EOF

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Broken Dockerfile build
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:latest
          RUN nonexistent-command-xyz
          EOF
          docker build -t test-fail .

  helm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Broken helm chart lint
        run: |
          helm create broken-chart
          cat > broken-chart/values.yaml <<'EOF'
          invalid: [unclosed
          EOF
          helm lint broken-chart

  bash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Failing bash script
        run: |
          set -euo pipefail
          echo "Testing bash failure"
          grep "needle" file-that-does-not-exist.txt

  yaml-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Broken YAML
        run: |
          python3 -m pip install --quiet pyyaml
          cat > bad.yml <<'EOF'
          key: value:
            - unindented
          EOF
          python3 -c "import yaml; yaml.safe_load(open('bad.yml'))"

  json-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Broken JSON
        run: |
          cat > bad.json <<'EOF'
          {"key": "value",}
          EOF
          python3 -m json.tool < bad.json

  code-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Failing code build
        run: |
          cat > index.js <<'EOF'
          console.log('hello'
          EOF
          node -c index.js

  naoru-action-terraform:
    needs: [terraform-check]
    if: ${{ always() && needs.terraform-check.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: openrouter
          model: deepseek/deepseek-v4-flash
          max-log-lines: 300
          failed-job-name: terraform-check

  ci-doctor-terraform:
    needs: [terraform-check]
    if: ${{ always() && needs.terraform-check.result == 'failure' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: ./.github/workflows/ci-doctor-reusable.yaml
    with:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      max-log-lines: 300
      failed-job-name: terraform-check
      sticky: false
    secrets:
      API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  naoru-action-docker:
    needs: [docker-check]
    if: ${{ always() && needs.docker-check.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          provider: openrouter
          model: deepseek/deepseek-v4-flash
          max-log-lines: 300
          failed-job-name: docker-check

  ci-doctor-docker:
    needs: [docker-check]
    if: ${{ always() && needs.docker-check.result == 'failure' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: ./.github/workflows/ci-doctor-reusable.yaml
    with:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      max-log-lines: 300
      failed-job-name: docker-check
      sticky: false
    secrets:
      API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  naoru-action-helm:
