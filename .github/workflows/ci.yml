name: CI-Node

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  naoru:
    needs: [build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.GROQ_API_KEY }}
          provider: openrouter
          model: deepseek/deepseek-v4-flash
          failed-job-name: build
          fix-mode: suggest