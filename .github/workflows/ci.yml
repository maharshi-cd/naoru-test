name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Failing build step
        run: |
          echo "Simulating build failure"
          node -e "throw new Error('Test failure for naoru')"

  naoru:
    needs: [build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: clouddrove/naoru@v0
        with:
          api-key: ${{ secrets.GROQ_API_KEY }}
          provider: groq