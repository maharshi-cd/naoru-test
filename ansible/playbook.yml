---
- name: Deploy app
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print deploy target
      ansible.builtin.debug:
        msg: "Deploying version {{ app_version }} to {{ deploy_env }}"

    - name: Create release marker
      ansible.builtin.copy:
        content: "release {{ app_version }}"
        dest: /tmp/release.txt
